# Runs on every pull request and push to main. NOTE: written without being able to run it here.
# Watch the first run and fix anything environment-specific.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app scripts
      - run: pytest -q
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json
      # Use `npm ci` once package-lock.json is committed.
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start backend with the SYNTHETIC dev model
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -m scripts.make_dev_model models/DEV_SYNTHETIC_model.pkl
          APP_ENV=local MODEL_PATH=models/DEV_SYNTHETIC_model.pkl \
            nohup uvicorn app.main:create_app --factory --no-access-log > backend.log 2>&1 &
      - name: Start frontend dev server
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          nohup npm run dev > frontend.log 2>&1 &
      - name: Run end-to-end tests
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npx wait-on http://localhost:8000/api/health http://localhost:5173 --timeout 60000
          npx playwright test
